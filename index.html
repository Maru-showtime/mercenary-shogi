<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>傭兵将棋（仮題）</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="app-header">
    <h1>傭兵将棋（仮題）</h1>
    <button id="back-to-draft" type="button">編成へ戻る</button>
    <button id="new-game" type="button">同じ編成で再戦</button>
    <label class="toggle" title="外すと漢字だけの表示になります"><input type="checkbox" id="sprite-toggle" checked /> イラスト</label>
    <label class="toggle"><input type="checkbox" id="animate-toggle" checked /> アニメーション</label>
  </header>

  <section id="draft-screen" class="draft-screen">
    <div class="intro">
      <h2>傭兵将棋とは</h2>
      <p>
        ふつうの将棋に「対局前の編成」を足した変種です。<strong>コスト10の範囲で、初期配置の駒を特殊な能力を持つ「傭兵」に差し替えられます。</strong>
        盤も駒の動きも<strong>通常の将棋と同じ9×9</strong>なので、いつもの感覚でそのまま指せます。違うのは編成だけです。
      </p>
      <p class="intro-note">
        傭兵は取られるか成るかすると能力を失い、ただの駒に戻ります。どこで能力を使い切るかが勝負どころです。
      </p>
    </div>

    <div class="mode-select">
      <label><input type="radio" name="mode" id="mode-cpu" checked /> CPU戦</label>
      <label><input type="radio" name="mode" id="mode-local" /> ローカル対戦（2人で交互に操作）</label>
    </div>

    <div class="mode-select" id="ai-side-select">
      <span>CPUの担当:</span>
      <label><input type="radio" name="ai-side" id="ai-gote" checked /> 後手（あなたが先手・先に指す）</label>
      <label><input type="radio" name="ai-side" id="ai-sente" /> 先手（CPUが先に指す）</label>
      <button id="reroll-ai" type="button">CPUの編成を選び直す</button>
    </div>
    <div id="draft-columns" class="draft-columns"></div>
    <button id="start-game" type="button">対局開始</button>
  </section>

  <main id="game-screen" class="app-main" hidden>
    <div class="side-panel">
      <div id="hand-gote" class="hand"></div>
    </div>

    <div class="board-column">
      <p id="status" class="status" aria-live="polite"></p>
      <!-- 筋（上）と段（右）の目盛り。本物の将棋盤と同じ並び -->
      <div class="board-frame">
        <div id="board-files" class="coords coords-files" aria-hidden="true"></div>
        <div id="board" class="board"></div>
        <div id="board-ranks" class="coords coords-ranks" aria-hidden="true"></div>
      </div>
    </div>

    <div class="side-panel">
      <div id="hand-sente" class="hand"></div>
    </div>
  </main>

  <ol id="log" class="log" hidden></ol>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
